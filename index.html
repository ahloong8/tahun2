<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arena Tahun 2">
<link rel="apple-touch-icon" href="icon-games.png">
<link rel="icon" href="icon-games.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Arena Tahun 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: a playground under the sky. Home = three game tickets + subject/level pickers; each game gets one arena panel with a slim status bar */
:root{
  --bg:#e7f2fb; --panel:#fbfdff; --line:#c3d6ea; --ink:#1d3557; --muted:#5a6f8a;
  --sky1:#bfe3ff; --sky2:#eaf6ff; --grass:#8fd07a;
  --sun:#f2b705; --sun-ink:#3b2c00;
  --pencil:var(--sun);
  --good:#23915a; --good-bg:#e3f5ea; --bad:#cf3f3f; --bad-bg:#fdeaea;
  --easy:#23915a; --medium:#c98a00; --hard:#cf3f3f;
  --s-en:#2f6fd0; --s-bm:#0f8a86; --s-zh:#c2410c; --s-sci:#4d7c0f; --s-math:#7c3aed;
  --b1:#ef5a6f; --b2:#3b82f6; --b3:#22a06b; --b4:#f59e0b; --b5:#a855f7;
  --btn:#ffffff; --shadow:0 3px 0 #c3d6ea; --card-back:#2f6fd0; --card-back2:#5b93e6;
  --display:"Baloo 2","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"Andika","Noto Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1726; --panel:#16233a; --line:#2c4263; --ink:#e6eef8; --muted:#9db0c8;
  --sky1:#1b2d52; --sky2:#243b66; --grass:#2f6b3a; --sun:#f2c94c; --sun-ink:#2a1f00;
  --good:#5fd08f; --good-bg:#153526; --bad:#ff7a7a; --bad-bg:#3a1a1d;
  --easy:#5fd08f; --medium:#f2c94c; --hard:#ff7a7a;
  --s-en:#7fb0ff; --s-bm:#4fd1c5; --s-zh:#ff9a5c; --s-sci:#a3d65c; --s-math:#b99bff;
  --b1:#f47285; --b2:#5c9bff; --b3:#3cc285; --b4:#f7b23b; --b5:#bd7cff;
  --btn:#1c2c47; --shadow:0 3px 0 #0a111c; --card-back:#2b5cad; --card-back2:#3d74cc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1726; --panel:#16233a; --line:#2c4263; --ink:#e6eef8; --muted:#9db0c8;
  --sky1:#1b2d52; --sky2:#243b66; --grass:#2f6b3a; --sun:#f2c94c; --sun-ink:#2a1f00;
  --good:#5fd08f; --good-bg:#153526; --bad:#ff7a7a; --bad-bg:#3a1a1d;
  --easy:#5fd08f; --medium:#f2c94c; --hard:#ff7a7a;
  --s-en:#7fb0ff; --s-bm:#4fd1c5; --s-zh:#ff9a5c; --s-sci:#a3d65c; --s-math:#b99bff;
  --b1:#f47285; --b2:#5c9bff; --b3:#3cc285; --b4:#f7b23b; --b5:#bd7cff;
  --btn:#1c2c47; --shadow:0 3px 0 #0a111c; --card-back:#2b5cad; --card-back2:#3d74cc; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;padding:0 16px}
.wrap{max-width:720px;margin:0 auto;padding-block:18px 40px}
header{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.8rem;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted)}
.mute{font:inherit;font-size:1.1rem;background:var(--btn);border:2px solid var(--line);border-radius:99px;padding:2px 12px;cursor:pointer;color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.label{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.game{font:inherit;cursor:pointer;color:var(--ink);background:var(--btn);border:2px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;box-shadow:var(--shadow);display:grid;gap:2px;justify-items:center;min-width:0}
.game .gi{font-size:2.6rem;line-height:1.1}
.game b{font-family:var(--display);font-size:1.1rem;line-height:1.1}
.game span{font-size:.78rem;color:var(--muted);line-height:1.25}
.game[aria-pressed="true"]{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 16%,var(--btn))}
.subjects{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:18px}
.subj{font:inherit;cursor:pointer;background:var(--btn);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 4px;display:grid;justify-items:center;gap:2px;box-shadow:var(--shadow);min-width:0}
.subj .ic{width:36px;height:36px;border-radius:10px;background:var(--c);color:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.15rem}
.subj b{font-size:.85rem;line-height:1.15;text-align:center}
.subj[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--btn))}
.levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.lv{font:inherit;font-weight:700;cursor:pointer;background:var(--btn);color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:6px 18px;box-shadow:var(--shadow)}
.lv[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--panel)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.go{width:100%;font:inherit;font-family:var(--display);font-weight:800;font-size:1.5rem;cursor:pointer;background:var(--sun);color:var(--sun-ink);border:0;border-radius:16px;padding:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.note{color:var(--muted);font-size:.9rem;margin:12px 0 0}
/* status bar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-variant-numeric:tabular-nums}
.chip{font-family:var(--display);font-weight:700;font-size:.9rem;padding:1px 10px;border-radius:99px;border:2px solid var(--c);color:var(--c);white-space:nowrap}
.spacer{flex:1}
.hearts{font-size:1.2rem;letter-spacing:.05em}
.score{font-family:var(--display);font-weight:800;font-size:1.2rem}
/* question panel */
.q{background:var(--btn);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.qtype{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;gap:8px;align-items:center}
.speak{font:inherit;font-size:.8rem;background:none;border:2px solid var(--line);color:var(--muted);border-radius:99px;padding:0 8px;cursor:pointer}
.visual{font-size:2.6rem;line-height:1.2;margin:2px 0}
.visual .hz{font-size:3rem;font-weight:700;border:2px dashed var(--line);border-radius:10px;padding:0 14px}
.visual .fig{display:block;max-width:100%;height:auto}
.q.small .visual .fig{width:110px}
.visual .count-grid{display:block;font-size:1.7rem;letter-spacing:.1em;line-height:1.3}
.visual .notes{display:flex;flex-wrap:wrap;gap:6px}
.visual .notes i{font-style:normal;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--good-bg);color:var(--good);border:2px solid var(--good);border-radius:8px;padding:2px 10px}
.visual .notes i.coin{border-radius:99px;background:var(--btn);color:var(--medium);border-color:var(--medium)}
.prompt{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.35;margin:2px 0 0;overflow-wrap:anywhere}
.prompt .blank{display:inline-block;min-width:2.6em;border-bottom:3px solid var(--sun)}
.hint{color:var(--muted);font-size:.95rem;margin:0}
.passage{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:1rem}
/* balloon arena */
.sky{position:relative;height:clamp(330px,52vh,440px);border-radius:16px;overflow:hidden;background:linear-gradient(to bottom,var(--sky1),var(--sky2));border:2px solid var(--line)}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:var(--grass)}
.cloud{position:absolute;font-size:2.4rem;opacity:.7;pointer-events:none}
.balloon{position:absolute;bottom:-150px;width:min(23%,112px);aspect-ratio:4/5;max-width:100%;border:0;padding:0;cursor:pointer;background:none;animation:rise var(--dur) linear var(--delay) forwards;z-index:2}
.balloon .body{display:grid;place-items:center;width:100%;height:100%;border-radius:50% 50% 48% 52% / 58% 58% 42% 42%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55) 0 12%,transparent 13%),var(--bc);color:#fff;font-family:var(--display);font-weight:800;font-size:var(--fs,1.35rem);line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.35);padding:4px;white-space:nowrap;animation:sway 2.4s ease-in-out infinite alternate;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:46px;background:var(--muted);opacity:.6}
.balloon.pop .body{animation:pop .35s ease-out forwards}
.balloon.pop::after{display:none}
.balloon.reveal .body{box-shadow:0 0 0 5px var(--good),0 0 18px 6px var(--good)}
.balloon.wrongpop .body{animation:pop .35s ease-out forwards;background:var(--bad)}
.sky.paused .balloon,.sky.paused .balloon .body{animation-play-state:paused}
@keyframes rise{from{bottom:-150px}to{bottom:105%}}
@keyframes sway{from{transform:rotate(-4deg) translateX(-3px)}to{transform:rotate(4deg) translateX(3px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
.burst{position:absolute;pointer-events:none;font-size:2rem;z-index:3;animation:burst .7s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(-50%,-160%) scale(1.3);opacity:0}}
/* feedback */
.fb{margin-top:10px;border-radius:14px;padding:12px 14px;border:2px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 4px;font-family:var(--display);font-size:1.2rem}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb p{margin:4px 0}
.row-end{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:10px 20px;cursor:pointer;border:2px solid var(--line);background:var(--btn);color:var(--ink);box-shadow:var(--shadow)}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
/* monster */
.stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;background:linear-gradient(to bottom,var(--sky1),var(--sky2));border:2px solid var(--line);border-radius:16px;padding:12px 14px 0;margin-bottom:10px;position:relative;overflow:hidden}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--grass)}
.fighter{display:grid;justify-items:center;gap:4px;position:relative;z-index:1;padding-bottom:12px}
.fighter .who{font-size:3.6rem;line-height:1}
.fighter.boss .who{font-size:4.6rem}
.hp{width:100%;max-width:170px;height:12px;border-radius:99px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.hp i{display:block;height:100%;background:var(--bad);transition:width .4s}
.hpnum{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.vs{font-family:var(--display);font-weight:800;color:var(--muted);align-self:center;z-index:1}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.float{position:absolute;top:0;left:50%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--bad);animation:floatup .9s ease-out forwards;pointer-events:none}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-50px)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.wide{grid-template-columns:1fr}
.opt{font:inherit;font-size:1.15rem;font-weight:700;background:var(--btn);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 10px;cursor:pointer;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.opts.wide .opt{text-align:left;font-weight:400;font-size:1.02rem}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
/* memory */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{position:relative;aspect-ratio:3/4;max-width:100%;border:0;padding:0;background:none;cursor:pointer;perspective:700px;font:inherit}
.card .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:4px}
.card .f{background:repeating-linear-gradient(45deg,var(--card-back) 0 10px,var(--card-back2) 10px 20px);border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);color:#fff;font-family:var(--display);font-weight:800;font-size:1.8rem}
.card .b{transform:rotateY(180deg);background:var(--btn);border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:var(--fs,1.25rem);line-height:1.1;text-align:center;overflow-wrap:anywhere;color:var(--ink)}
.card .b.emo{font-size:2.4rem}
.card.done .b{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.card.miss .b{border-color:var(--bad);background:var(--bad-bg)}
.toast{min-height:3.2em;margin-top:10px;border-radius:12px;padding:8px 12px;background:var(--btn);border:2px dashed var(--line);font-size:1rem}
/* results */
.result{text-align:center}
.stars{font-size:2.6rem;letter-spacing:.1em}
.big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.review{display:grid;gap:10px;margin-top:8px;text-align:left}
.review div{background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem}
.review .rq{font-weight:700}
.muted{color:var(--muted)}
.track{position:relative;background:linear-gradient(to bottom,var(--sky2),var(--sky1));border:2px solid var(--line);border-radius:16px;padding:8px 10px;margin-bottom:10px;display:grid;gap:6px}
.lane{position:relative;height:3.2rem;border-radius:10px;background:repeating-linear-gradient(90deg,var(--muted) 0 18px,transparent 18px 34px) center/100% 3px no-repeat,var(--line)}
.lane .tag{position:absolute;left:6px;top:2px;font-size:.7rem;color:var(--muted);font-weight:700}
.runner{position:absolute;bottom:2px;left:calc(var(--p,0) * (100% - 3.4rem));font-size:2.4rem;line-height:1;transform:scaleX(-1);transition:left .6s ease-out}
.flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:2rem}
.timer{font-family:var(--display);font-weight:800;font-size:1.2rem;padding:0 10px;border-radius:99px;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{border-color:var(--bad);color:var(--bad)}
.claim{display:block;margin-top:6px;font-size:1.5rem}
.blank.fill{color:var(--s-en);padding:0 4px}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf{font:inherit;font-family:var(--display);font-weight:800;font-size:1.8rem;padding:14px;border-radius:16px;cursor:pointer;border:0;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.tf.yes{background:var(--b3)} .tf.no{background:var(--b1)} .tf:disabled{opacity:.6;cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.slot{min-width:2.6rem;height:2.9rem;padding:0 8px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.35rem;background:var(--btn)}
.slot.filled{border-style:solid;border-color:var(--good);background:var(--good-bg);color:var(--good)}
.sep{color:var(--muted);font-weight:800}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{font:inherit;font-family:var(--display);font-weight:800;font-size:1.45rem;min-width:3.2rem;padding:8px 14px;border-radius:12px;cursor:pointer;background:var(--sun);color:var(--sun-ink);border:0;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.tile.used{visibility:hidden}
.tile.hint{outline:4px solid var(--good);outline-offset:2px}
.river{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:repeating-linear-gradient(170deg,color-mix(in srgb,var(--b2) 55%,var(--sky2)) 0 22px,color-mix(in srgb,var(--b2) 45%,var(--sky2)) 22px 44px);display:grid;gap:18px;padding:0 0 0}
.shore{background:var(--grass);padding:6px 12px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:3.4rem}
.shore.near{justify-content:center}
.dots{display:inline-flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--panel);opacity:.5}.dots i.on{opacity:1;background:var(--sun)}
.pads{display:flex;justify-content:space-around;gap:8px;padding:0 8px;flex-wrap:wrap}
.pad{font:inherit;cursor:pointer;border:0;width:min(24%,112px);min-width:4.4rem;aspect-ratio:5/4;border-radius:50% 50% 46% 54%/55% 50% 50% 45%;background:radial-gradient(circle at 70% 30%,transparent 0 14%,var(--b3) 15%);display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--b3) 55%,#000);padding:4px;transition:transform .3s,opacity .3s}
.pad span{font-family:var(--display);font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);font-size:1.1rem;line-height:1.05;overflow-wrap:anywhere}
.pad.ok{box-shadow:0 0 0 4px var(--sun),0 5px 0 color-mix(in srgb,var(--b3) 55%,#000)}
.pad.sink{transform:scale(.6) translateY(20px);opacity:.3}
.frog{display:inline-block;font-size:2.8rem;line-height:1;transition:transform .45s cubic-bezier(.3,1.6,.5,1);position:relative;z-index:3}
.field{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--grass);border-radius:16px;padding:12px;border:2px solid var(--line)}
.hole{position:relative;height:5.6rem;border-radius:50%/40%;background:radial-gradient(ellipse at 50% 80%,#3b2a1a 0 45%,transparent 46%);display:grid;align-items:end;justify-items:center;overflow:hidden}
.mole{font:inherit;cursor:pointer;border:0;background:none;padding:0;display:grid;justify-items:center;animation:moleup .22s ease-out;max-width:100%}
.mole .m{font-size:2.6rem;line-height:1}
.mole .lbl{background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-family:var(--display);font-weight:800;font-size:1rem;line-height:1.3;max-width:100%;overflow-wrap:anywhere}
.mole.bonk{transform:scale(.85)} .mole.bad .lbl{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
@keyframes moleup{from{transform:translateY(70%)}to{transform:none}}
.orch{position:relative;height:clamp(300px,46vh,400px);border-radius:16px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(to bottom,var(--sky1),var(--sky2));display:grid;grid-template-columns:repeat(var(--n),1fr)}
.orch::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--grass)}
.lanecol{border-right:2px dashed color-mix(in srgb,var(--line) 70%,transparent);cursor:pointer}.lanecol:last-of-type{border-right:0}
.fruit{position:absolute;top:0;width:5.2rem;display:grid;justify-items:center;pointer-events:none;z-index:2}
.fruit .fe{font-size:2.2rem;line-height:1}
.fruit .lbl{background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:0 5px;font-family:var(--display);font-weight:800;font-size:.95rem;line-height:1.25;text-align:center;max-width:100%;overflow-wrap:anywhere;color:var(--ink)}
.basket{position:absolute;bottom:10px;font-size:3.2rem;line-height:1;transition:left .15s;z-index:3;pointer-events:none}
.movebtns{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.movebtns .btn{font-size:1.4rem;padding:6px 22px}.movebtns span{font-size:.8rem;text-align:center}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
.cell{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--btn);border:2px solid var(--line);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cell:nth-child(odd){background:color-mix(in srgb,var(--sky1) 50%,var(--btn))}
.cell .num{font-size:.8rem;color:var(--muted);position:absolute;top:2px;left:5px}
.cell.start .num,.cell.goal .num{position:static;font-size:1.6rem}
.cell.goal{border-color:var(--sun)}
.token{font-size:1.9rem;line-height:1;animation:hop .25s}
@keyframes hop{50%{transform:translateY(-8px)}}
.dicebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.dice{font-size:3rem;line-height:1}
.wheelbox{display:grid;justify-items:center;gap:8px;margin-bottom:10px}
.pointer{font-size:1.8rem;color:var(--bad);line-height:.6;z-index:2}
.wheelwrap{max-width:100%}.wheelsvg{display:block;max-width:100%;height:auto;transform-origin:50% 50%}
.bingo{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.bcell{font:inherit;font-family:var(--display);font-weight:800;font-size:1.15rem;aspect-ratio:1;max-width:100%;border-radius:12px;border:2px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;padding:4px;overflow-wrap:anywhere;line-height:1.1;box-shadow:var(--shadow)}
.bcell.mk{background:var(--good-bg);border-color:var(--good);color:var(--good);position:relative}
.bcell.mk::after{content:"✓";position:absolute;top:2px;right:6px;font-size:.9rem}
.bcell.ln{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.bcell.reveal{box-shadow:0 0 0 4px var(--good)}
.lvtag{display:inline-block;font-size:.72rem;font-weight:700;padding:0 8px;border-radius:99px;border:2px solid var(--c);color:var(--c);vertical-align:middle}
.tbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:var(--good);transition:width .1s linear}.tbar i.low{background:var(--bad)}
.lanefield{position:relative;height:6.2rem;border-radius:16px;border:2px solid var(--line);background:linear-gradient(to bottom,var(--sky1) 0 60%,var(--grass) 60%);margin-bottom:10px;overflow:hidden}
.castle{position:absolute;left:4px;bottom:6px;font-size:3.2rem;line-height:1}.archer{position:absolute;left:2.6rem;bottom:2.6rem;font-size:1.4rem}
.enemy{position:absolute;bottom:10px;font-size:2.4rem;line-height:1;transition:none}.enemy.tg{filter:drop-shadow(0 0 6px var(--bad))}.enemy.tg::after{content:"▼";position:absolute;top:-1.1rem;left:50%;transform:translateX(-50%);font-size:.9rem;color:var(--bad)}
.towerwrap{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:10px;align-items:start}
.tower{display:grid;gap:3px;background:var(--line);padding:4px;border-radius:12px}
.floor{position:relative;height:1.9rem;border-radius:6px;background:var(--btn);display:flex;align-items:center;padding:0 6px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.floor.done{background:var(--good-bg);color:var(--good)}.floor.here{background:var(--sun);color:var(--sun-ink);font-weight:700}
.climber{position:absolute;right:2px;font-size:1.4rem;line-height:1}
.ladwrap{display:grid;grid-template-columns:7.2rem minmax(0,1fr);gap:10px;align-items:start}
.ladder{list-style:none;margin:0;padding:4px;border-radius:12px;background:var(--line);display:grid;gap:2px;font-variant-numeric:tabular-nums}
.ladder li{display:flex;justify-content:space-between;gap:4px;padding:1px 8px;border-radius:6px;background:var(--btn);font-size:.78rem;color:var(--muted)}
.ladder li.safe{border-left:4px solid var(--b2)}.ladder li.got{background:var(--good-bg);color:var(--good)}.ladder li.now{background:var(--sun);color:var(--sun-ink);font-weight:800}
.lifelines{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.lifelines .btn{padding:4px 12px;font-size:.9rem}.lifelines .btn:disabled{opacity:.4;text-decoration:line-through}
@media (max-width:480px){.towerwrap,.ladwrap{grid-template-columns:1fr}.tower{grid-auto-flow:column;grid-template-rows:1fr;direction:rtl}.floor{height:2.2rem;justify-content:center;padding:0;font-size:.6rem;direction:ltr;flex-direction:column}.climber{position:static;font-size:1.1rem}
 .ladder{grid-template-columns:repeat(6,1fr);direction:rtl}.ladder li{direction:ltr;flex-direction:column;align-items:center;padding:1px 2px;font-size:.62rem}}
@media (max-width:560px){.subjects{grid-template-columns:repeat(3,minmax(0,1fr))}.games{gap:6px}.game span:not(.gi){display:none}.game .gi{font-size:2rem}}
@media (max-width:420px){.panel{padding:12px}.prompt{font-size:1.2rem}.fighter .who{font-size:2.8rem}.fighter.boss .who{font-size:3.6rem}.grid{gap:6px}.card .b.emo{font-size:1.9rem}}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}.balloon .body{animation:none}.shake,.float,.burst{animation-duration:.01s}}

<div class="wrap">
  <header><h1>Arena Tahun 2<small>二年级游戏 · 5 科目 · KSSR SJK(C)</small></h1>
    <button class="mute" id="mute" aria-label="声音开关">🔊</button></header>
  <main class="panel" id="app"></main>
</div>

<script>
const R = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const opts = (ans, pool, n=4) => shuffle([ans, ...shuffle([...new Set(pool)].filter(x=>x!==ans)).slice(0,n-1)]);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const B = '<span class="blank">___</span>';
const cap = s => s[0].toUpperCase()+s.slice(1);

// ---------- word banks ----------
const ANIMALS=[['cat','🐱','猫'],['dog','🐶','狗'],['duck','🦆','鸭子'],['fish','🐟','鱼'],['bird','🐦','鸟'],['rabbit','🐰','兔子'],['elephant','🐘','大象'],['tiger','🐯','老虎'],['monkey','🐒','猴子'],['horse','🐴','马'],['frog','🐸','青蛙'],['cow','🐮','牛'],['owl','🦉','猫头鹰'],['ant','🐜','蚂蚁'],['chicken','🐔','鸡'],['goat','🐐','山羊'],['pig','🐷','猪'],['bee','🐝','蜜蜂']];
const FOOD=[['apple','🍎','苹果'],['banana','🍌','香蕉'],['orange','🍊','橙'],['egg','🥚','鸡蛋'],['mango','🥭','芒果'],['grapes','🍇','葡萄'],['watermelon','🍉','西瓜'],['bread','🍞','面包'],['milk','🥛','牛奶'],['ice cream','🍦','冰淇淋'],['carrot','🥕','胡萝卜'],['cake','🍰','蛋糕'],['corn','🌽','玉米']];
const THINGS=[['pencil','✏️','铅笔'],['book','📕','书'],['bag','🎒','书包'],['ruler','📏','尺'],['umbrella','☂️','雨伞'],['clock','⏰','时钟'],['ball','⚽','球'],['car','🚗','车'],['bus','🚌','巴士'],['house','🏠','房子'],['tree','🌳','树'],['star','⭐','星星'],['sun','☀️','太阳'],['moon','🌙','月亮'],['hat','👒','帽子'],['shoe','👟','鞋子'],['shirt','👕','衬衫'],['kite','🪁','风筝'],['bicycle','🚲','脚车'],['flower','🌸','花']];
const VOCAB=[...ANIMALS,...FOOD,...THINGS];
const COLOURS=[['red','🔴','红色'],['blue','🔵','蓝色'],['green','🟢','绿色'],['yellow','🟡','黄色'],['black','⚫','黑色'],['white','⚪','白色'],['orange','🟠','橙色'],['purple','🟣','紫色'],['brown','🟤','棕色']];
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_ZH=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const BOYS=['Ali','Ravi','Ah Chong','Kumar','Daniel','Hafiz','Wei Jie'];
const GIRLS=['Siti','Mei Ling','Aminah','Priya','Sarah','Nurul','Xin Yi'];

// ---------- question generators ----------
const EN = {
  pictureWord(){ const [w,e,z]=R(VOCAB);
    return {type:'Look and choose',key:'pw'+w,visual:e,prompt:'What is this?',
      options:opts(w,VOCAB.map(v=>v[0])),answer:w,
      zh:`图片里的是「${z}」，英文叫 <b>${w}</b>。`}; },
  aAn(){ const list=[...VOCAB.filter(v=>!['grapes','milk','bread','corn'].includes(v[0])),['uncle','👨','叔叔'],['igloo','🧊','冰屋'],['insect','🐛','昆虫']];
    const [w,e,z]=R(list); const ans=/^[aeiou]/.test(w)?'an':'a';
    return {type:'a or an',key:'aa'+w,visual:e,prompt:`This is ${B} ${w}.`,options:['a','an'],answer:ans,
      zh:ans==='an'?`<b>${w}</b>（${z}）是以元音字母 <b>${w[0]}</b> 开头的。元音字母是 a, e, i, o, u，前面要用 <b>an</b>。`
                   :`<b>${w}</b>（${z}）是以辅音字母 <b>${w[0]}</b> 开头的，所以前面用 <b>a</b>。只有 a, e, i, o, u 开头才用 an。`}; },
  colour(){ const [w,e,z]=R(COLOURS);
    return {type:'Colours',key:'co'+w,visual:e,prompt:'What colour is this?',options:opts(w,COLOURS.map(c=>c[0])),answer:w,
      zh:`这个颜色是「${z}」，英文是 <b>${w}</b>。`}; },
  countEasy(){ const n=2+Math.floor(Math.random()*9); const [w,e,z]=R([...ANIMALS,...FOOD].filter(v=>v[0]!=='ice cream'));
    return {type:'Count',key:'cn'+n+w,visual:e.repeat(n),prompt:`How many? There are ${B}.`,
      options:opts(NUM[n],[NUM[n-1],NUM[n+1],NUM[n+2]||NUM[n-2],NUM[Math.max(1,n-2)]]),answer:NUM[n],
      zh:`数一数，一共有 ${n} 个${z}。数字 ${n} 的英文是 <b>${NUM[n]}</b>。`}; },
  missingLetter(){ const pool=VOCAB.filter(v=>/^[a-z]{3,5}$/.test(v[0])); const [w,e,z]=R(pool);
    const i=Math.floor(Math.random()*w.length); const L=w[i];
    const others=shuffle('aeioubcdgmnprst'.split('').filter(c=>c!==L)).slice(0,2);
    const shown=w.split('').map((c,k)=>k===i?'_':c).join(' ');
    return {type:'Missing letter',key:'ml'+w,visual:e,prompt:shown,options:shuffle([L,...others]),answer:L,
      zh:`这个是「${z}」，正确拼写是 <b>${w}</b>（${w.split('').join('-')}），所以缺的字母是 <b>${L}</b>。`}; },
  bodyPart(){ const T=[['I see with my','eyes','眼睛','看'],['I hear with my','ears','耳朵','听'],['I smell with my','nose','鼻子','闻'],['I eat with my','mouth','嘴巴','吃东西'],['I write with my','hand','手','写字'],['I walk with my','legs','腿','走路'],['I kick the ball with my','foot','脚','踢球'],['I brush my','teeth','牙齿','刷']];
    const [s,a,z,v]=R(T); const emo={eyes:'👀',ears:'👂',nose:'👃',mouth:'👄',hand:'✋',legs:'🦵',foot:'🦶',teeth:'🦷'};
    return {type:'My body',key:'bp'+a,visual:'🧒',prompt:`${s} ${B}.`,options:opts(a,T.map(t=>t[1])),answer:a,
      zh:`我们用${z}来${v}。${z}的英文是 <b>${a}</b> ${emo[a]}。`}; },
  isAre(){ const T=[['The cat','s','sleeping on the mat.'],['The cats','p','sleeping on the mat.'],['My mother','s','a teacher.'],['My parents','p','at home.'],['Ali','s','in Year 2.'],['Ali and Ravi','p','good friends.'],['The apple','s','red.'],['The apples','p','sweet.'],['The sky','s','blue.'],['The birds','p','in the tree.'],['My bag','s','heavy.'],['The children','p','in the classroom.'],['It','s','a sunny day.'],['They','p','playing football.'],['She','s','my sister.'],['We','p','happy today.'],['I','i','seven years old.'],['I','i','in the canteen.'],['You','p','my best friend.'],['There','s','a cat under the table.'],['There','p2','three ducks in the pond.']];
    const [s,n,rest]=R(T); const ans=n==='i'?'am':(n==='p'||n==='p2')?'are':'is';
    let zh = n==='i'?'主语是 <b>I</b>（我），I 后面永远用 <b>am</b>。'
      : s==='You'?'<b>You</b>（你）后面用 <b>are</b>。'
      : s==='There'? (ans==='is'?'后面是一样东西（a cat，单数），所以用 <b>There is</b>。':'后面是很多样东西（three ducks，复数），所以用 <b>There are</b>。')
      : ans==='is'?`<b>${s}</b> 是一个人或一样东西（单数），所以用 <b>is</b>。`
      : `<b>${s}</b> 是两个或以上（复数），所以用 <b>are</b>。`;
    return {type:'is / am / are',key:'ia'+s+rest,prompt:`${s} ${B} ${rest}`,options:['is','am','are'],answer:ans,zh}; },
  plural(level){ const T=[['cat','s','猫'],['dog','s','狗'],['book','s','书'],['pencil','s','铅笔'],['bird','s','鸟'],['tree','s','树'],['box','es','箱子'],['bus','es','巴士'],['dish','es','碟子'],['watch','es','手表'],['glass','es','杯子'],['brush','es','刷子'],['tomato','es','番茄'],['baby','ies','婴儿'],['lorry','ies','罗里'],['lady','ies','女士'],['cherry','ies','樱桃'],['butterfly','ies','蝴蝶']];
    const pool=level==='hard'?T.filter(t=>t[1]!=='s'):T; const [w,r,z]=R(pool);
    const pl = r==='ies'? w.slice(0,-1)+'ies' : w+r;
    const wrongs=[w+'s',w+'es',w.endsWith('y')?w.slice(0,-1)+'ys':w+'ies',w].filter(x=>x!==pl);
    const n=2+Math.floor(Math.random()*8);
    const rule = r==='s'?`一般的名词，变复数直接加 <b>s</b>：${w} → <b>${pl}</b>。`
      : r==='es'?`以 s, x, sh, ch, o 结尾的词，变复数要加 <b>es</b>：${w} → <b>${pl}</b>。`
      : `以「辅音字母 + y」结尾的词，要把 y 变成 i 再加 <b>es</b>：${w} → <b>${pl}</b>。`;
    return {type:'One and many',key:'pl'+w,prompt:`one ${w}, ${NUM[n]} ${B}`,options:opts(pl,wrongs),answer:pl,
      zh:`「${z}」多过一个时要用复数。${rule}`}; },
  irregular(){ const T=[['child','children','小孩'],['man','men','男人'],['woman','women','女人'],['foot','feet','脚'],['tooth','teeth','牙齿'],['mouse','mice','老鼠'],['fish','fish','鱼'],['sheep','sheep','羊'],['goose','geese','鹅'],['leaf','leaves','叶子'],['knife','knives','刀'],['person','people','人']];
    const [w,p,z]=R(T); const n=2+Math.floor(Math.random()*8);
    const note = w===p?`<b>${w}</b> 的复数和单数一样，不用加 s。`
      : /f(e)?$/.test(w)?`以 f / fe 结尾的词，要把 f 变成 v 再加 es：${w} → <b>${p}</b>。`
      : `<b>${w}</b> 是特别的词，复数不加 s，要背起来：${w} → <b>${p}</b>。`;
    return {type:'Special plurals',key:'ir'+w,prompt:`one ${w}, ${NUM[n]} ${B}`,options:opts(p,[w+'s',w+'es',w,p+'s']),answer:p,
      zh:`「${z}」${note}`}; },
  preposition(){ const things=[['cat','猫'],['ball','球'],['book','书'],['doll','洋娃娃'],['pencil','铅笔'],['dog','狗']];
    const places=[['box','箱子'],['table','桌子'],['chair','椅子'],['bed','床'],['bag','书包'],['door','门']];
    const P=[['in','里面'],['on','上面'],['under','下面'],['behind','后面'],['next to','旁边']];
    const [t,tz]=R(things); const [p,pz]=R(places.filter(x=>x[0]!==t)); const [pr,prz]=R(P);
    return {type:'Where is it?',key:'pr'+t+p+pr,prompt:`The ${t} is ${B} the ${p}.`,hint:`（${tz}在${pz}${prz}）`,
      options:opts(pr,P.map(x=>x[0])),answer:pr,
      zh:`「${prz}」的英文是 <b>${pr}</b>。记住：in 里面，on 上面，under 下面，behind 后面，next to 旁边。`}; },
  opposite(){ const T=[['big','small','大','小'],['hot','cold','热','冷'],['tall','short','高','矮'],['happy','sad','开心','伤心'],['fast','slow','快','慢'],['open','close','开','关'],['up','down','上','下'],['old','new','旧','新'],['clean','dirty','干净','脏'],['day','night','白天','晚上'],['fat','thin','胖','瘦'],['in','out','里','外'],['wet','dry','湿','干'],['full','empty','满','空'],['heavy','light','重','轻'],['long','short','长','短']];
    const [a,b,za,zb]=R(T); const flip=Math.random()<.5; const q=flip?b:a, ans=flip?a:b;
    return {type:'Opposites',key:'op'+q,prompt:`The opposite of <b>${q}</b> is ${B}.`,
      options:opts(ans,T.flatMap(t=>[t[0],t[1]]).filter(x=>x!==q)),answer:ans,
      zh:`<b>${q}</b> 是「${flip?zb:za}」，相反词是「${flip?za:zb}」<b>${ans}</b>。`}; },
  daySeq(){ const i=Math.floor(Math.random()*7); const after=Math.random()<.5; const j=after?(i+1)%7:(i+6)%7;
    return {type:'Days of the week',key:'dy'+i+after,prompt:`What day comes ${after?'after':'before'} <b>${DAYS[i]}</b>?`,
      options:opts(DAYS[j],DAYS.filter(d=>d!==DAYS[i])),answer:DAYS[j],
      zh:`${DAYS[i]} 是${DAYS_ZH[i]}。${after?'之后':'之前'}的一天是${DAYS_ZH[j]}，英文是 <b>${DAYS[j]}</b>。一星期的顺序：Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday。`}; },
  monthSeq(){ const i=Math.floor(Math.random()*12); const after=Math.random()<.5; const j=after?(i+1)%12:(i+11)%12;
    return {type:'Months of the year',key:'mo'+i+after,prompt:`Which month comes ${after?'after':'before'} <b>${MONTHS[i]}</b>?`,
      options:opts(MONTHS[j],MONTHS.filter(m=>m!==MONTHS[i])),answer:MONTHS[j],
      zh:`${MONTHS[i]} 是 ${i+1} 月，${after?'下一个':'上一个'}月是 ${j+1} 月，英文是 <b>${MONTHS[j]}</b>。`}; },
  pronoun(){ const kind=R(['boy','girl','thing','many']); let s,ans,zh;
    if(kind==='boy'){const n=R(BOYS); s=`${n} is my friend. ${B} is very kind.`; ans='He'; zh=`${n} 是男生，男生用 <b>He</b>（他）。`}
    else if(kind==='girl'){const n=R(GIRLS); s=`${n} is my classmate. ${B} likes to read.`; ans='She'; zh=`${n} 是女生，女生用 <b>She</b>（她）。`}
    else if(kind==='thing'){const [w,,z]=R(THINGS); s=`I have a ${w}. ${B} is new.`; ans='It'; zh=`${w}（${z}）是东西，不是人。一样东西或一只动物用 <b>It</b>（它）。`}
    else {const a=R(BOYS),b=R(GIRLS); s=`${a} and ${b} are in the park. ${B} are playing.`; ans='They'; zh=`${a} 和 ${b} 是两个人（多过一个），所以用 <b>They</b>（他们）。`}
    return {type:'He / She / It / They',key:'pn'+s,prompt:s,options:['He','She','It','They'],answer:ans,zh}; },
  haveHas(){ const subj=R([['I','have','我'],['We','have','我们'],['They','have','他们'],['You','have','你'],['He','has','他'],['She','has','她'],['My brother','has','我的哥哥'],[R(GIRLS),'has',''],[R(BOYS),'has',''],['The cat','has','那只猫']]);
    const obj=R(['a red bag','two pencils','a new bicycle','long hair','a pet rabbit','many books','a big kite']);
    const [s,a]=subj;
    return {type:'have / has',key:'hh'+s+obj,prompt:`${s} ${B} ${obj}.`,options:['have','has'],answer:a,
      zh:a==='have'?`主语是 <b>${s}</b>。I, you, we, they 后面用 <b>have</b>。`:`主语 <b>${s}</b> 是一个人或一只动物（he / she / it），后面用 <b>has</b>。`}; },

  sentence(){ const T=[['I like to eat apples.','我喜欢吃苹果。'],['My cat is very cute.','我的猫很可爱。'],['We go to school by bus.','我们搭巴士去学校。'],['She has a blue bag.','她有一个蓝色的书包。'],['The sun is very hot today.','今天太阳很热。'],['Ali is playing football.','阿里在踢足球。'],['My mother is a nurse.','我的妈妈是护士。'],['There are five ducks in the pond.','池塘里有五只鸭子。'],['I brush my teeth every morning.','我每天早上刷牙。'],['Can you swim?','你会游泳吗？'],['The book is on the table.','书在桌子上。'],['They are reading in the library.','他们在图书馆看书。']];

const ZN=['零','一','二','三','四','五','六','七','八','九','十'];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function nOpts(ans,cands,fmt=String){ const s=new Set([ans]); for(const c of shuffle(cands)) if(c>=0&&s.size<4&&Number.isFinite(c)) s.add(c);
  let d=1; while(s.size<4){ s.add(ans+d); if(s.size<4&&ans-d>=0) s.add(ans-d); d++; } return shuffle([...s]).map(fmt); }
function cols(n){ return {h:Math.floor(n/100)%10,t:Math.floor(n/10)%10,o:n%10}; }
function addExplain(a,b){ const A=cols(a),Bc=cols(b); const c1=A.o+Bc.o>=10, c2=A.t+Bc.t+(c1?1:0)>=10;
  let s=`${a} + ${b} = <b>${a+b}</b>。先加个位：${A.o} + ${Bc.o} = ${A.o+Bc.o}${c1?'，满十要进 1 到十位':''}。再加十位${c1?'（记得加上进位的 1）':''}`;
  if(a>=100||b>=100||a+b>=100) s+=`，最后加百位${c2?'（十位满十，要进 1 到百位）':''}`; return s+'。'; }
function subExplain(a,b){ const A=cols(a),Bc=cols(b); const b1=A.o<Bc.o;
  return `${a} − ${b} = <b>${a-b}</b>。先减个位${b1?`：${A.o} 不够减 ${Bc.o}，要向十位借 1，变成 ${A.o+10} − ${Bc.o} = ${A.o+10-Bc.o}`:`：${A.o} − ${Bc.o} = ${A.o-Bc.o}`}，再减十位${a>=100?'，最后减百位':''}。可以用加法检查：${a-b} + ${b} = ${a}。`; }
function clockSVG(h,m){ let t='',n='';
  for(let i=0;i<60;i++){ const a=i*6*Math.PI/180, r1=i%5?44:40; t+=`<line x1="${(50+47*Math.sin(a)).toFixed(1)}" y1="${(50-47*Math.cos(a)).toFixed(1)}" x2="${(50+r1*Math.sin(a)).toFixed(1)}" y2="${(50-r1*Math.cos(a)).toFixed(1)}" stroke="var(--muted)" stroke-width="${i%5?0.6:1.4}"/>`; }
  for(let i=1;i<=12;i++){ const a=i*30*Math.PI/180; n+=`<text x="${(50+33*Math.sin(a)).toFixed(1)}" y="${(50-33*Math.cos(a)+3.6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)" font-family="var(--body)">${i}</text>`; }
  const ha=((h%12)+m/60)*30*Math.PI/180, ma=m*6*Math.PI/180;
  return `<svg class="fig" viewBox="0 0 100 100" width="160" height="160" role="img" aria-label="时钟"><circle cx="50" cy="50" r="48" fill="var(--btn)" stroke="var(--ink)" stroke-width="2"/>${t}${n}<line x1="50" y1="50" x2="${(50+20*Math.sin(ha)).toFixed(1)}" y2="${(50-20*Math.cos(ha)).toFixed(1)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="${(50+36*Math.sin(ma)).toFixed(1)}" y2="${(50-36*Math.cos(ma)).toFixed(1)}" stroke="var(--hard)" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="var(--ink)"/></svg>`; }
function fracSVG(k,d){ const w=200/d; let r='';
  for(let i=0;i<d;i++) r+=`<rect x="${4+i*w}" y="4" width="${w}" height="52" fill="${i<k?'var(--pencil)':'var(--btn)'}" stroke="var(--ink)" stroke-width="2"/>`;
  return `<svg class="fig" viewBox="0 0 208 60" width="240" height="70" role="img" aria-label="分数图">${r}</svg>`; }

function misspell(w){ const bad=new Set(); let g=0;
  const mut=[s=>{const i=1+Math.floor(Math.random()*(s.length-2));return s.slice(0,i)+s[i+1]+s[i]+s.slice(i+2)},
             s=>{const i=1+Math.floor(Math.random()*(s.length-1));return s.slice(0,i)+s.slice(i+1)},
             s=>{const i=1+Math.floor(Math.random()*(s.length-1));return s.slice(0,i)+s[i]+s.slice(i)},
             s=>s.replace(/[aeiou]/,v=>R('aeiou'.replace(v,'').split('')))];
  while(bad.size<3&&g++<80){const m=R(mut)(w); if(m!==w&&m.length>2) bad.add(m);} return [...bad]; }

function makeQueue(subj,level,filter){
  const S_=SUBJECTS[subj]; const seen=new Set(); let bag=[];
  return ()=>{ for(let g=0;g<300;g++){ if(!bag.length) bag=shuffle(S_.levels[level]);
      const q=S_.gens[bag.pop()](level); if(seen.has(q.key)) continue; if(filter&&!filter(q)) continue; seen.add(q.key); return q; }
    seen.clear(); return S_.gens[R(S_.levels[level])](level); };
}

  if(subj==='en'){
    if(level==='easy') src=VOCAB.filter(v=>v[0].length<=8).map(([w,e,z])=>[e,w,`${e} = <b>${w}</b>（${z}）`,1]);
    else if(level==='medium') src=NUM.slice(1).map((w,i)=>[String(i+1),w,`${i+1} = <b>${w}</b>`]);
    else src=[['child','children'],['man','men'],['woman','women'],['foot','feet'],['tooth','teeth'],['mouse','mice'],['goose','geese'],['leaf','leaves'],['knife','knives'],['person','people'],['baby','babies'],['box','boxes']].map(([a,b])=>[a,b,`一个 ${a}，很多个就是 <b>${b}</b>`]);
  } else if(subj==='bm'){
    if(level==='easy') src=BM_PIC.filter(v=>v[0].length<=9).map(([w,e,z])=>[e,w,`${e} = <b>${w}</b>（${z}）`,1]);
    else if(level==='medium') src=BM_ANT.map(([a,b,za,zb])=>[a,b,`<b>${a}</b>（${za}）⟷ <b>${b}</b>（${zb}）是相反词`]);
    else src=BM_KERJA.map(([r,me,,,,,z])=>[r,me,`<b>${r}</b>（${z}）加上 me- 变成 <b>${me}</b>`]);
  } else if(subj==='zh'){
    if(level==='easy') src=ZH_PICS.map(c=>[ZH_PY[c][2],c,`${ZH_PY[c][2]} = <b>${c}</b>（${py(ZH_PY[c][0],ZH_PY[c][1])}）`,1]);
    else if(level==='medium') src=ZH_CHARS.map(c=>[c,py(ZH_PY[c][0],ZH_PY[c][1]),`「${c}」读 <b>${py(ZH_PY[c][0],ZH_PY[c][1])}</b>`]);
    else src=ZH_ANT.map(([a,b])=>[a,b,`「${a}」和「${b}」是反义词`]);
  } else if(subj==='sci'){
    src=SC_PAIRS.map(([a,b])=>[a,b,`<b>${a}</b> → ${b}`]);
  } else {
    for(let k=0;k<60;k++){ let a,b,op,v;
      if(level==='easy'){a=ri2(1,12);b=ri2(1,20-a);op='+';v=a+b;}
      else if(level==='medium'){a=R([2,5,10]);b=ri2(1,10);op='×';v=a*b;}
      else { if(Math.random()<.5){a=R([3,4]);b=ri2(2,10);op='×';v=a*b;} else {b=R([2,3,4,5,10]);v=ri2(2,10);a=b*v;op='÷';} }
      src.push([`${a} ${op} ${b}`,String(v),`${a} ${op} ${b} = <b>${v}</b>`]); }
  }
  const out=[], A=new Set(), Bs=new Set();
  for(const p of shuffle(src)){ if(out.length>=n) break; if(A.has(p[0])||Bs.has(p[1])||A.has(p[1])||Bs.has(p[0])) continue; A.add(p[0]);Bs.add(p[1]);out.push(p); }
  return out;
}

  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02);}catch(e){} }

const SC_SEQ=[['鸡的生命周期','🐔',['蛋','小鸡','鸡']],['青蛙的生命周期','🐸',['卵','蝌蚪','幼蛙','青蛙']],['蝴蝶的生命周期','🦋',['卵','幼虫','蛹','蝴蝶']],['蚊子的生命周期','🦟',['卵','孑孓','蛹','蚊子']],['人的成长','🧒',['婴儿','儿童','少年','成人','老人']],['植物的成长','🌱',['种子','发芽','幼苗','开花','结果']],['动物从小到大','🐾',['蚂蚁','老鼠','狗','马','大象']],['一天的时间','🕒',['早上','中午','下午','晚上']]];
function orderItem(subj,level){
  const extraFrom=(pool,seq,k)=>shuffle([...new Set(pool)].filter(x=>!seq.includes(x))).slice(0,k);
  if(subj==='en'){ const [lo,hi]={easy:[3,4],medium:[5,5],hard:[6,8]}[level];
    const [w,e,z]=R(VOCAB.filter(v=>/^[a-z]+$/.test(v[0])&&v[0].length>=lo&&v[0].length<=hi)); const seq=w.split('');
    return {key:w,title:'拼出这个英文单词',visual:e,hint:`（${z}）`,seq,extra:level==='hard'?extraFrom('abcdefghijklmnopqrstuvwxyz'.split(''),seq,2):[],joiner:'',
      zh:`${e}「${z}」的英文是 <b>${w}</b>：${seq.join(' - ')}。`}; }
  if(subj==='bm'){ const pool=BM_SUKU.filter(s=>level==='easy'?s.length===2:true); const s=R(pool); const w=s.join(''); const [e,z]=BM_MEAN[w]||['',''];
    return {key:w,title:'用音节（suku kata）拼出这个词',visual:e||null,hint:z?`（${z}）`:'',seq:s,extra:extraFrom(BM_SUKU.flat(),s,{easy:0,medium:1,hard:2}[level]),joiner:'',
      zh:`${z?`「${z}」的国文是 `:''}<b>${w}</b>，音节是 ${s.join(' - ')}。`}; }
  if(subj==='zh'){ const [w,e]=R(level==='hard'?ZH_WORDS3:ZH_WORDS2); const seq=[...w];
    return {key:w,title:'排出正确的词语',visual:e,hint:'',seq,extra:level==='easy'?[]:extraFrom([...ZH_WORDS2,...ZH_WORDS3].flatMap(x=>[...x[0]]),seq,1),joiner:'',
      zh:`${e} 是「<b>${w}</b>」，字的顺序是 ${seq.join(' → ')}。`}; }
  if(subj==='sci'){ const [t,e,seq]=R(SC_SEQ);
    return {key:t,title:`按顺序排好：${t}`,visual:e,hint:'',seq,extra:level==='hard'?extraFrom(['蚂蚁','马','种子','幼苗','婴儿','老人','中午','晚上','蝌蚪','小鸡'],seq,1):[],joiner:' → ',
      zh:`${t}的正确顺序：<b>${seq.join(' → ')}</b>。`}; }
  const n=level==='easy'?4:5, set=new Set(); while(set.size<n) set.add(level==='easy'?ri(10,99):ri(100,999)); const nums=[...set]; const down=level==='hard';
  const seq=nums.sort((a,b)=>down?b-a:a-b).map(String);
  return {key:seq.join(),title:down?'从大到小排一排':'从小到大排一排',visual:null,hint:'',seq,extra:[],joiner:down?' > ':' < ',
    zh:`${down?'从大到小':'从小到大'}：<b>${seq.join(down?' > ':' < ')}</b>。先比较${level==='easy'?'十位，十位一样再比较个位':'百位，百位一样再比较十位，然后比较个位'}。`};
}
const ORD_N=6;
function startOrder(){ S={...S,screen:'order',round:0,mist:0,wrong:[],seenKeys:new Set()}; oRound(); }
function oRound(){
  clearTimers(); let it; for(let g=0;g<40;g++){ it=orderItem(S.subject,S.level); if(!S.seenKeys.has(it.key)) break; } S.seenKeys.add(it.key);
  S.item=it; S.pos=0; S.rmiss=0; S.lock=false;
  const tiles=shuffle([...it.seq,...it.extra]);
  app.innerHTML=statusBar(`<span class="muted">第 ${S.round+1}/${ORD_N} 关</span><span class="score">✗ ${S.mist}</span>`)+`
    <div class="q"><p class="qtype">排一排 · 按正确顺序点</p>${it.visual?`<div class="visual" aria-hidden="true">${it.visual}</div>`:''}<p class="prompt">${it.title}</p>${it.hint?`<p class="hint">${esc(it.hint)}</p>`:''}</div>
    <div class="slots">${it.seq.map((_,k)=>`<span class="slot" id="sl-${k}"></span>`).join(it.joiner.trim()?`<span class="sep">${it.joiner.trim()}</span>`:'')}</div>
    <div class="tiles">${tiles.map((t,k)=>`<button class="tile" id="tl-${k}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div><div id="fb"></div>`;
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>oTap(b));
}
function oTap(b){
  if(S.lock||b.classList.contains('used')) return; const it=S.item, want=it.seq[S.pos];
  if(b.dataset.t===want){ b.classList.add('used'); b.disabled=true; app.querySelectorAll('.tile.hint').forEach(x=>x.classList.remove('hint'));
    const sl=document.getElementById('sl-'+S.pos); sl.textContent=want; sl.classList.add('filled'); S.pos++; sfx.flip();
    if(S.pos===it.seq.length){ S.lock=true; S.round++; sfx.good();
      document.getElementById('fb').innerHTML=`<div class="fb ok"><h3>${S.rmiss?'✓ 完成了！':'✓ 完美，一次就对！'}</h3><p>${it.zh}</p></div>`;
      later(()=> S.round>=ORD_N?endGame(true):oRound(), 1500); }
  } else { S.mist++; S.rmiss++; sfx.bad(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    document.querySelector('.bar .score').textContent='✗ '+S.mist;
    if(S.rmiss===1) S.wrong.push({q:{prompt:it.title+(it.hint?' '+it.hint:''),answer:it.seq.join(it.joiner),zh:it.zh},v:b.dataset.t});
    const cand=[...app.querySelectorAll('.tile:not(.used)')].find(x=>x.dataset.t===want); if(cand) cand.classList.add('hint');
    document.getElementById('fb').innerHTML=`<div class="fb no"><h3>✗ 不是「${esc(b.dataset.t)}」</h3><p>下一个应该是「<b>${esc(want)}</b>」（已经亮起来了）。</p><p>${it.zh}</p></div>`; }
}

// =============== shared MCQ helpers ===============
function mcqHTML(q){ return qPanel(q)+`<div class="opts ${q.wide||q.options.some(o=>String(o).length>14)?'wide':''}">${q.options.map((o,k)=>`<button class="opt" id="opt-${k}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div>`; }
function mcqMark(q,btn){ app.querySelectorAll('.opt').forEach(b=>{b.disabled=true; if(b.dataset.v===q.answer) b.classList.add('right');}); if(btn.dataset.v!==q.answer) btn.classList.add('wrong'); return btn.dataset.v===q.answer; }
function contBtn(label,fn){ const fb=document.getElementById('fb'); fb.insertAdjacentHTML('beforeend',`<div class="row-end"><button class="btn primary" id="cont">${label}</button></div>`); const c=document.getElementById('cont'); c.onclick=fn; c.focus({preventScroll:true}); }
const shortOK=q=>balloonOK(q)&&String(q.answer).length<=10;

// =============== FROG ===============
const FROG={easy:6,medium:8,hard:10};
function startFrog(){ S={...S,screen:'frog',next:makeQueue(S.subject,S.level,shortOK),row:0,rows:FROG[S.level],lives:3,wrong:[],lock:false}; fRound(); }
function fRound(){ clearTimers(); const q=S.cur=S.next(); S.lock=false;
  app.innerHTML=statusBar(`<span class="hearts">${heartStr(S.lives,3)}</span><span class="muted">还有 ${S.rows-S.row} 步</span>`)+qPanel(q,true)+`
    <div class="river" id="river">
      <div class="shore far">🏝️ 对岸 <span class="dots">${[...Array(S.rows)].map((_,i)=>`<i class="${i<S.row?'on':''}"></i>`).join('')}</span></div>
      <div class="pads">${shuffle(q.options).map((o,k)=>`<button class="pad" id="pad-${k}" data-v="${esc(o)}"><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="shore near"><span class="frog" id="frog">🐸</span></div>
    </div><div id="fb"></div>`;
  bindSpeak(q); app.querySelectorAll('.pad').forEach(b=>b.onclick=()=>fJump(b));
}
function fJump(pad){ if(S.lock) return; S.lock=true; const q=S.cur, frog=document.getElementById('frog');
  const a=pad.getBoundingClientRect(), f=frog.getBoundingClientRect();
  frog.style.transform=`translate(${a.left+a.width/2-(f.left+f.width/2)}px,${a.top+a.height/2-(f.top+f.height/2)}px)`;
  if(pad.dataset.v===q.answer){ sfx.good(); pad.classList.add('ok'); S.row++;
    document.getElementById('fb').innerHTML=`<div class="fb ok"><h3>✓ 跳对了！</h3></div>`;
    later(()=> S.row>=S.rows?endGame(true):fRound(), 900);
  } else { later(()=>{ pad.classList.add('sink'); frog.textContent='💦'; sfx.bad(); },420); S.lives--; S.wrong.push({q,v:pad.dataset.v});
    app.querySelectorAll('.pad').forEach(p=>{ if(p.dataset.v===q.answer) p.classList.add('ok'); });
    document.querySelector('.hearts').textContent=heartStr(S.lives,3);
    document.getElementById('fb').innerHTML=wrongBox(q,'✗ 扑通！掉进水里了');
    contBtn(S.lives<=0?'看结果':'再跳一次 →',()=> S.lives<=0?endGame(false):fRound()); }
}

// =============== WHACK-A-MOLE ===============
const MOLE={easy:{stay:2600,gap:1000,lim:16000,n:12},medium:{stay:2600,gap:1000,lim:16000,n:15},hard:{stay:2600,gap:1000,lim:16000,n:15}};
function startMole(){ S={...S,screen:'mole',next:makeQueue(S.subject,S.level,shortOK),lives:3,score:0,round:0,total:MOLE[S.level].n,wrong:[]}; wRound(); }
function wRound(){ clearTimers(); const q=S.cur=S.next(), base=MOLE[S.level]; S.round++; const cfg=base; S.lock=false; S.since=0;
  app.innerHTML=statusBar(`<span class="hearts">${heartStr(S.lives,3)}</span><span class="score">🔨 ${S.score}</span><span class="muted">${S.round}/${S.total}</span>`)+qPanel(q,true)+`
    <p class="hint" style="margin:0 0 6px">点有正确答案的地鼠！</p>
    <div class="field">${[...Array(9)].map((_,i)=>`<div class="hole" id="ho-${i}"></div>`).join('')}</div><div id="fb"></div>`;
  bindSpeak(q);
  const tick=()=>{ if(S.lock) return; const holes=[...app.querySelectorAll('.hole')].filter(h=>!h.firstChild); if(!holes.length) return;
    const up=[...app.querySelectorAll('.mole')].map(m=>m.dataset.v);
    let v = (S.since>=2||Math.random()<.35)&&!up.includes(q.answer) ? q.answer : R(q.options.filter(o=>!up.includes(o))||q.options);
    if(v===undefined) return; S.since = v===q.answer?0:S.since+1;
    const h=R(holes), m=document.createElement('button'); m.className='mole'; m.dataset.v=v; m.innerHTML=`<span class="lbl">${esc(v)}</span><span class="m">🐹</span>`;
    m.onclick=()=>wHit(m); h.appendChild(m); later(()=>{ if(m.isConnected&&!S.lock) m.remove(); }, cfg.stay); };
  later(tick,300); every(tick,cfg.gap);
  later(()=>{ if(!S.lock) wMiss(null); }, cfg.lim);
}
function wHit(m){ if(S.lock) return; const q=S.cur;
  if(m.dataset.v===q.answer){ S.lock=true; S.score++; sfx.pop(); sfx.good(); m.classList.add('bonk'); m.querySelector('.m').textContent='😵';
    document.getElementById('fb').innerHTML=`<div class="fb ok"><h3>✓ 打中了！</h3></div>`;
    later(()=> S.round>=S.total?endGame(true):wRound(), 800);
  } else { m.classList.add('bad'); wMiss(m); } }
function wMiss(m){ S.lock=true; S.lives--; sfx.bad(); const q=S.cur; S.wrong.push({q,v:m?m.dataset.v:'（时间到）'});
  document.querySelector('.hearts').textContent=heartStr(S.lives,3);
  document.getElementById('fb').innerHTML=wrongBox(q,m?'✗ 打错地鼠了':'⏰ 时间到！');
  const over=S.lives<=0||S.round>=S.total; contBtn(over?'看成绩':'继续 →',()=> over?endGame(S.lives>0):wRound()); }

// =============== CATCH ===============
const CATCH={easy:{sp:.12,n:12},medium:{sp:.12,n:15},hard:{sp:.12,n:15}};
const FRUITS=['🍎','🍊','🍋','🍇','🍓','🍑','🥭','🍐','🍉','🍒'];
function startCatch(){ S={...S,screen:'catch',next:makeQueue(S.subject,S.level,shortOK),lives:3,score:0,round:0,total:CATCH[S.level].n,wrong:[]}; cRound(); }
function cRound(){ clearTimers(); const q=S.cur=S.next(); S.round++; S.lock=false; const n=q.options.length; S.lanes=n; S.lane=Math.floor(n/2);
  app.innerHTML=statusBar(`<span class="hearts">${heartStr(S.lives,3)}</span><span class="score">🧺 ${S.score}</span><span class="muted">${S.round}/${S.total}</span>`)+qPanel(q,true)+`
    <div class="orch" id="orch" style="--n:${n}">${[...Array(n)].map((_,i)=>`<div class="lanecol" data-l="${i}"></div>`).join('')}<div class="basket" id="basket">🧺</div></div>
    <div class="movebtns"><button class="btn" id="mvL" aria-label="向左">◀</button><span class="muted">点果子下面的地方，或按 ◀ ▶ 移动篮子</span><button class="btn" id="mvR" aria-label="向右">▶</button></div><div id="fb"></div>`;
  bindSpeak(q);
  const orch=document.getElementById('orch');
  app.querySelectorAll('.lanecol').forEach(c=>c.onclick=()=>{S.lane=+c.dataset.l;cPlace();});
  document.getElementById('mvL').onclick=()=>{S.lane=Math.max(0,S.lane-1);cPlace();}; document.getElementById('mvR').onclick=()=>{S.lane=Math.min(S.lanes-1,S.lane+1);cPlace();};
  const H=orch.clientHeight, fr=shuffle(FRUITS);
  S.items=shuffle(q.options).map((o,i)=>{ const el=document.createElement('div'); el.className='fruit'; el.innerHTML=`<span class="fe">${fr[i]}</span><span class="lbl">${esc(o)}</span>`;
    el.style.left=`calc(${(i+.5)*100/n}% - 2.6rem)`; orch.appendChild(el); return {el,v:o,lane:i,y:-70-Math.random()*H*.55,sp:CATCH[S.level].sp*(0.85+Math.random()*.3),done:false}; });
  cPlace(); let last=performance.now(); const catchY=H-92;
  const loop=t=>{ if(S.lock||S.screen!=='catch'||!orch.isConnected) return; const dt=Math.min(50,t-last); last=t;
    for(const it of S.items){ if(it.done) continue; it.y+=it.sp*dt; it.el.style.transform=`translateY(${it.y}px)`;
      if(it.y>=catchY&&it.y<catchY+40&&it.lane===S.lane){ it.done=true; it.el.remove(); return cCaught(it); }
      if(it.y>H){ it.done=true; it.el.remove(); if(it.v===S.cur.answer) return cCaught(null); } }
    requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
function cPlace(){ const b=document.getElementById('basket'); if(b) b.style.left=`calc(${(S.lane+.5)*100/S.lanes}% - 1.9rem)`; }
function cCaught(it){ S.lock=true; const q=S.cur;
  if(it&&it.v===q.answer){ S.score++; sfx.good(); document.getElementById('basket').classList.add('shake');
    document.getElementById('fb').innerHTML=`<div class="fb ok"><h3>✓ 接到了！</h3></div>`; later(()=> S.round>=S.total?endGame(true):cRound(), 800); return; }
  S.lives--; sfx.bad(); S.wrong.push({q,v:it?it.v:'（没接到）'}); document.querySelector('.hearts').textContent=heartStr(S.lives,3);
  document.getElementById('fb').innerHTML=wrongBox(q,it?`✗ 接错了，「${esc(it.v)}」不对`:'✗ 正确的果子掉下去了！');
  const over=S.lives<=0||S.round>=S.total; contBtn(over?'看成绩':'继续 →',()=> over?endGame(S.lives>0):cRound()); }

// =============== BOARD (dice) ===============
const BOARD={easy:15,medium:20,hard:25};
function startBoard(){ S={...S,screen:'board',next:makeQueue(S.subject,S.level),N:BOARD[S.level],pos:0,rolls:0,wrong:[],score:0,answered:true}; bDraw(); bRollUI(); }
function bDraw(){ const N=S.N, rows=N/5; let cells='';
  for(let i=0;i<N;i++){ const r=Math.floor(i/5), c=r%2?4-i%5:i%5;
    cells+=`<div class="cell ${i===N-1?'goal':''} ${i===0?'start':''}" style="grid-row:${rows-r};grid-column:${c+1}"><span class="num">${i===0?'🏠':i===N-1?'💎':i}</span>${i===S.pos?'<span class="token">🧸</span>':''}</div>`; }
  const bd=document.getElementById('board'); if(bd) bd.innerHTML=cells; return cells; }
function bRollUI(){ clearTimers();
  app.innerHTML=statusBar(`<span class="muted">掷了 ${S.rolls} 次 · 答错 ${S.wrong.length} 题</span>`)+`<div class="board" id="board">${bDraw()}</div>
    <div class="dicebar"><span class="dice" id="dice">🎲</span><button class="btn primary" id="roll">掷骰子</button><span class="muted">走到 💎 就赢了</span></div><div id="qa"></div>`;
  document.getElementById('roll').onclick=bRoll; document.getElementById('roll').focus({preventScroll:true}); }
function bRoll(){ const btn=document.getElementById('roll'); btn.disabled=true; S.rolls++; const d=ri(1,6), dice=document.getElementById('dice'); const F='⚀⚁⚂⚃⚄⚅';
  let k=0; every(()=>{ dice.textContent=F[ri(0,5)]; tone(500+k*40,.03,'square',0,.03); k++; },80);
  later(()=>{ clearTimers(); dice.textContent=F[d-1]; S.prev=S.pos; let steps=Math.min(d,S.N-1-S.pos), s=0;
    const walk=()=>{ if(s>=steps){ return S.pos>=S.N-1?later(()=>endGame(true),500):bAsk(d); } S.pos++; s++; bDraw(); tone(700,.05,'triangle',0,.05); later(walk,260); };
    walk(); },700); }
function bAsk(d){ const q=S.cur=S.next(); S.answered=false;
  document.getElementById('qa').innerHTML=`<p class="hint">掷到 ${d}！答对才可以留在第 ${S.pos} 格，答错要退回第 ${S.prev} 格。</p>`+mcqHTML(q);
  bindSpeak(q); app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(S.answered) return; S.answered=true; const ok=mcqMark(q,b);
    if(ok){ S.score++; sfx.good(); document.getElementById('fb').innerHTML=`<div class="fb ok"><h3>✓ 答对了！留在第 ${S.pos} 格</h3></div>`; later(bRollUI,900); }
    else { sfx.bad(); S.wrong.push({q,v:b.dataset.v}); S.pos=S.prev; bDraw(); document.getElementById('fb').innerHTML=wrongBox(q,`✗ 答错了，退回第 ${S.pos} 格`); contBtn('继续掷骰子 →',bRollUI); } });
  document.getElementById('qa').scrollIntoView({behavior:'smooth',block:'nearest'}); }

// =============== WHEEL ===============
const WV=[10,20,50,10,30,100,20,40], WSPINS=8;
function wheelSVG(){ let s=''; const cols=['var(--b1)','var(--b2)','var(--b3)','var(--b4)','var(--b5)','var(--b2)','var(--b3)','var(--b4)'];
  WV.forEach((v,k)=>{ const a0=(k*45-22.5)*Math.PI/180, a1=(k*45+22.5)*Math.PI/180, am=k*45*Math.PI/180;
    s+=`<path d="M0 0 L${(100*Math.sin(a0)).toFixed(2)} ${(-100*Math.cos(a0)).toFixed(2)} A100 100 0 0 1 ${(100*Math.sin(a1)).toFixed(2)} ${(-100*Math.cos(a1)).toFixed(2)} Z" fill="${cols[k]}" stroke="var(--panel)" stroke-width="2"/>`;
    s+=`<text x="${(66*Math.sin(am)).toFixed(1)}" y="${(-66*Math.cos(am)+7).toFixed(1)}" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" font-family="var(--display)" transform="rotate(${k*45} ${(66*Math.sin(am)).toFixed(1)} ${(-66*Math.cos(am)).toFixed(1)})">${v}</text>`; });
  return `<svg viewBox="-104 -104 208 208" width="230" height="230" class="wheelsvg" id="wsvg" role="img" aria-label="转盘">${s}<circle r="14" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/></svg>`; }
function startWheel(){ S={...S,screen:'wheel',next:makeQueue(S.subject,S.level),spin:0,points:0,rot:0,wrong:[],score:0,answered:true}; wUI(); }
function wUI(){ clearTimers();
  app.innerHTML=statusBar(`<span class="score">🏆 ${S.points} 分</span><span class="muted">第 ${Math.min(S.spin+1,WSPINS)}/${WSPINS} 转</span>`)+`
    <div class="wheelbox"><div class="pointer">▼</div><div class="wheelwrap">${wheelSVG()}</div><button class="btn primary" id="spin">转一转 🎡</button></div><div id="qa"></div>`;
  document.getElementById('wsvg').style.transform=`rotate(${S.rot}deg)`; document.getElementById('spin').onclick=wSpin; }
function wSpin(){ document.getElementById('spin').disabled=true; const k=ri(0,7); S.spin++;
  const cur=((S.rot%360)+360)%360; const target=((360-k*45)%360+360)%360; S.rot=S.rot+360*5+((target-cur+360)%360);
  const svg=document.getElementById('wsvg'); svg.style.transition='transform 3s cubic-bezier(.15,.8,.2,1)'; svg.style.transform=`rotate(${S.rot}deg)`;
  for(let i=0;i<14;i++) later(()=>tone(600,.03,'square',0,.03),i*i*14);
  later(()=>{ const v=WV[k]; S.val=v; const q=S.cur=S.next(); S.answered=false; tone(880,.15,'triangle');
    document.getElementById('qa').innerHTML=`<div class="fb ok" style="margin:0 0 10px"><h3>转到 ${v} 分！答对就可以拿到 ${v} 分</h3></div>`+mcqHTML(q);
    bindSpeak(q); document.getElementById('qa').scrollIntoView({behavior:'smooth',block:'nearest'});
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(S.answered) return; S.answered=true; const ok=mcqMark(q,b); const last=S.spin>=WSPINS;
      if(ok){ S.points+=v; S.score++; sfx.good(); document.getElementById('fb').innerHTML=`<div class="fb ok"><h3>✓ 答对了！+${v} 分</h3></div>`; later(()=> last?endGame(true):wUI(),900); }
      else { sfx.bad(); S.wrong.push({q,v:b.dataset.v}); document.getElementById('fb').innerHTML=wrongBox(q,'✗ 答错了，这次没有分数'); contBtn(last?'看成绩':'再转一次 →',()=> last?endGame(true):wUI()); } });
  },3100); }

// =============== BINGO ===============
const BINGO={easy:[3,1],medium:[4,1],hard:[4,2]};
function startBingo(){ let [size,need]=BINGO[S.level]; const nx=makeQueue(S.subject,S.level,q=>shortOK(q)&&String(q.answer).length<=8); const qs=[], ans=new Set();
  for(let g=0;g<600&&qs.length<size*size;g++){ const q=nx(); if(ans.has(q.answer)) continue; ans.add(q.answer); qs.push(q); }
  if(qs.length<size*size){ size=3; need=1; qs.length=Math.min(qs.length,9); }
  S={...S,screen:'bingo',size,need,cells:shuffle(qs.map(q=>q.answer)),marked:new Set(),queue:shuffle(qs),wrong:[],score:0,lock:false}; bgRound(); }
function bgLines(){ const n=S.size, m=S.marked, L=[]; for(let i=0;i<n;i++){ L.push([...Array(n)].map((_,j)=>i*n+j)); L.push([...Array(n)].map((_,j)=>j*n+i)); }
  L.push([...Array(n)].map((_,j)=>j*n+j)); L.push([...Array(n)].map((_,j)=>j*n+n-1-j)); return L.filter(l=>l.every(k=>m.has(k))); }
function bgRound(){ clearTimers(); S.lock=false; const q=S.cur=S.queue[0]; const lines=bgLines(); const lineCells=new Set(lines.flat());
  app.innerHTML=statusBar(`<span class="score">🎯 ${lines.length}/${S.need} 条线</span><span class="muted">错 ${S.wrong.length}</span>`)+`
    <div class="q small"><p class="qtype">${q.type} ${'speechSynthesis' in window?`<button class="speak" id="speak" aria-label="朗读">🔊</button>`:''}</p>${q.visual?`<div class="visual" aria-hidden="true">${q.visual}</div>`:''}<p class="prompt">${q.prompt}</p>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:''}</div>
    <p class="hint" style="margin:0 0 6px">在格子里找到答案，连成 ${S.need} 条线（横、直、斜）就 BINGO！</p>
    <div class="bingo" style="--n:${S.size}">${S.cells.map((a,k)=>`<button class="bcell ${S.marked.has(k)?'mk':''} ${lineCells.has(k)?'ln':''}" id="bc-${k}" data-k="${k}" ${S.marked.has(k)?'disabled':''}>${esc(a)}</button>`).join('')}</div><div id="fb"></div>`;
  bindSpeak(q); app.querySelectorAll('.bcell').forEach(b=>b.onclick=()=>bgTap(b)); }
function bgTap(b){ if(S.lock) return; S.lock=true; const q=S.cur, k=+b.dataset.k;
  if(S.cells[k]===q.answer){ S.marked.add(k); S.queue.shift(); S.score++; sfx.good(); b.classList.add('mk');
    const lines=bgLines().length; const done=lines>=S.need||!S.queue.length;
    document.getElementById('fb').innerHTML=`<div class="fb ok"><h3>${done&&lines>=S.need?'🎉 BINGO！':'✓ 答对了！'}</h3></div>`; later(()=> done?endGame(true):bgRound(), done?1200:700);
  } else { b.classList.add('shake'); sfx.bad(); S.wrong.push({q,v:S.cells[k]}); S.queue.push(S.queue.shift());
    const ri_=S.cells.indexOf(q.answer); const rb=document.getElementById('bc-'+ri_); if(rb) rb.classList.add('reveal');
    document.getElementById('fb').innerHTML=wrongBox(q,'✗ 答错了（这题等一下会再出现）'); contBtn('继续 →',bgRound); } }

// =============== difficulty ramp helper ===============
const LVS=['easy','medium','hard'];
function rampQueue(subj,base,filter){ const qs={}; LVS.forEach(l=>qs[l]=makeQueue(subj,l,filter)); const b=LVS.indexOf(base);
  return stage=>{ let up=Math.random()<Math.min(.9,stage*.3)?1:0; if(stage>=3&&Math.random()<.35) up++; const l=LVS[Math.min(2,b+up)]; const q=qs[l](); q._lv=l; return q; }; }
const lvTag=q=>q._lv?`<span class="lvtag" style="--c:${LV[q._lv][1]}">${LV[q._lv][0]}题</span>`:'';
function timerBar(){ return `<div class="tbar"><i id="tfill"></i></div>`; }
function runTimer(ms,onEnd){ S.tLeft=ms; S.tMax=ms; const f=document.getElementById('tfill');
  every(()=>{ if(S.paused) return; S.tLeft-=100; if(f){ f.style.width=Math.max(0,S.tLeft/S.tMax*100)+'%'; f.classList.toggle('low',S.tLeft<S.tMax*.3);} if(S.tLeft<=0&&!S.paused){ S.paused=true; onEnd(); } },100); }

// =============== CASTLE DEFENSE ===============
const CASTLE={easy:{walk:18000,gap:5500},medium:{walk:18000,gap:5500},hard:{walk:18000,gap:5500}};
const WAVES=[{n:4,emo:'👾'},{n:5,emo:'👻'},{n:6,emo:'🦇'}];
function startCastle(){ S={...S,screen:'castle',next:rampQueue(S.subject,S.level),wave:0,hp:3,wrong:[],score:0,paused:true}; cdWave(); }
function cdWave(){ clearTimers(); const w=WAVES[S.wave], sp=1;
  S.enemies=[]; S.toSpawn=w.n; S.walk=CASTLE[S.level].walk*sp; S.gap=CASTLE[S.level].gap*sp; S.target=null; S.paused=false; S.lastSpawn=-1e9; S.clock=0;
  app.innerHTML=statusBar(`<span class="hearts">${'🧱'.repeat(S.hp)}${'▫️'.repeat(3-S.hp)}</span><span class="muted" id="wv">第 ${S.wave+1}/3 波 · 剩 ${w.n}</span>`)+`
    <div class="lanefield" id="lf"><span class="castle">🏰</span><span class="archer">🏹</span></div><div id="qa"></div>`;
  let last=performance.now(); const lf=document.getElementById('lf');
  const loop=t=>{ if(S.screen!=='castle'||!lf.isConnected) return; const dt=Math.min(60,t-last); last=t;
    if(!S.paused){ S.clock=(S.clock||0)+dt;
      if(S.toSpawn>0&&S.clock-S.lastSpawn>=S.gap){ S.lastSpawn=S.clock; S.toSpawn--; const el=document.createElement('span'); el.className='enemy'; el.textContent=w.emo; lf.appendChild(el); S.enemies.push({el,x:1,q:null}); if(!S.target) cdTarget(); }
      for(const e of [...S.enemies]){ e.x-=dt/S.walk; e.el.style.left=`calc(${Math.max(0,e.x)} * (100% - 5.5rem) + 3.2rem)`;
        if(e.x<=0){ cdBreach(e); break; } } }
    requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  cdInfo();
}
function cdInfo(){ const el=document.getElementById('wv'); if(el) el.textContent=`第 ${S.wave+1}/3 波 · 剩 ${S.enemies.length+S.toSpawn}`; }
function cdTarget(){ S.enemies.sort((a,b)=>a.x-b.x); const e=S.enemies[0]; S.target=e||null; document.querySelectorAll('.enemy').forEach(x=>x.classList.remove('tg'));
  const qa=document.getElementById('qa'); if(!e){ qa.innerHTML=S.toSpawn>0?`<p class="hint">下一只怪兽快来了……</p>`:''; return; }
  e.el.classList.add('tg'); const q=e.q=e.q||S.next(S.wave); S.answered=false; S.cur=q;
  qa.innerHTML=`<p class="hint">回答问题，射倒最前面的怪兽！ ${lvTag(q)}</p>`+mcqHTML(q); bindSpeak(q);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>cdAnswer(b)); }
function cdAnswer(b){ if(S.answered||S.paused) return; S.answered=true; const q=S.cur, e=S.target; const ok=mcqMark(q,b);
  if(ok){ S.score++; sfx.good(); e.el.textContent='💥'; S.enemies=S.enemies.filter(x=>x!==e); later(()=>e.el.remove(),400); cdInfo();
    if(!S.enemies.length&&!S.toSpawn) return cdWaveDone(); later(cdTarget,500);
  } else { S.paused=true; sfx.bad(); S.wrong.push({q,v:b.dataset.v}); e.q=null;
    document.getElementById('fb').innerHTML=wrongBox(q,'✗ 没射中！（游戏暂停）'); contBtn('继续 →',()=>{ S.paused=false; cdTarget(); }); } }
function cdBreach(e){ S.enemies=S.enemies.filter(x=>x!==e); e.el.remove(); S.hp--; sfx.bad(); const lf=document.getElementById('lf'); lf.classList.add('shake'); later(()=>lf.classList.remove('shake'),500);
  document.querySelector('.hearts').textContent='🧱'.repeat(Math.max(0,S.hp))+'▫️'.repeat(3-Math.max(0,S.hp)); cdInfo();
  if(e===S.target){ S.paused=true; S.wrong.push({q:e.q,v:'（来不及回答）'}); app.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    document.getElementById('fb').innerHTML=wrongBox(e.q,'⏰ 怪兽冲进城堡了！');
    contBtn(S.hp<=0?'看结果':'继续守城 →',()=>{ if(S.hp<=0) return endGame(false); S.paused=false; if(!S.enemies.length&&!S.toSpawn) return cdWaveDone(); cdTarget(); }); return; }
  if(S.hp<=0){ S.paused=true; return later(()=>endGame(false),500); }
  if(!S.enemies.length&&!S.toSpawn) cdWaveDone(); }
function cdWaveDone(){ S.paused=true; sfx.win(); if(S.wave>=WAVES.length-1) return later(()=>endGame(true),700);
  document.getElementById('qa').innerHTML=`<div class="fb ok"><h3>🎉 第 ${S.wave+1} 波打完了！</h3><p>下一波：怪兽更多，题目也会难一点。</p></div><div id="fb"></div>`;
  contBtn(`开始第 ${S.wave+2} 波 →`,()=>{ S.wave++; S.clock=0; cdWave(); }); }

// =============== TOWER CLIMB ===============
const TOWER={easy:{floors:8,t:25000},medium:{floors:10,t:25000},hard:{floors:12,t:25000}};
function startTower(){ S={...S,screen:'tower',next:rampQueue(S.subject,S.level),floor:0,floors:TOWER[S.level].floors,lives:3,wrong:[],score:0,paused:true,best:0}; twRound(); }
function twRound(){ clearTimers(); const stage=Math.floor(S.floor/(S.floors/4)); const q=S.cur=S.next(stage); S.answered=false; S.paused=false;
  const ms=TOWER[S.level].t;
  let fl=''; for(let i=S.floors;i>=0;i--) fl+=`<div class="floor ${i===S.floor?'here':''} ${i<S.floor?'done':''}"><span class="fn">${i===S.floors?'🚩':i===0?'地面':i+' 楼'}</span>${i===S.floor?'<span class="climber">🧗</span>':''}</div>`;
  app.innerHTML=statusBar(`<span class="hearts">${heartStr(S.lives,3)}</span><span class="muted">第 ${S.floor}/${S.floors} 层 · ⏱ ${Math.round(ms/1000)} 秒</span>`)+`
    <div class="towerwrap"><div class="tower">${fl}</div><div class="towerq">${timerBar()}<p class="hint" style="margin:4px 0">越往上，题目越难 ${lvTag(q)}</p>${mcqHTML(q)}</div></div>`;
  bindSpeak(q); app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>twAnswer(b));
  runTimer(ms,()=>twFail(null)); }
function twAnswer(b){ if(S.answered) return; S.answered=true; S.paused=true; const q=S.cur;
  if(mcqMark(q,b)){ S.score++; S.floor++; S.best=Math.max(S.best,S.floor); sfx.good(); document.getElementById('fb').innerHTML=`<div class="fb ok"><h3>✓ 爬上第 ${S.floor} 层！</h3></div>`;
    later(()=> S.floor>=S.floors?endGame(true):twRound(), 800); }
  else twFail(b); }
function twFail(b){ S.answered=true; S.paused=true; const q=S.cur; sfx.bad(); S.lives--; S.wrong.push({q,v:b?b.dataset.v:'（时间到）'});
  app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.v===q.answer) x.classList.add('right');});
  const drop=S.floor>0; if(drop) S.floor--; document.querySelector('.hearts').textContent=heartStr(S.lives,3);
  document.getElementById('fb').innerHTML=wrongBox(q,(b?'✗ 答错了':'⏰ 时间到！')+(drop?'，滑下一层':''));
  contBtn(S.lives<=0?'看结果':'继续爬 →',()=> S.lives<=0?endGame(false):twRound()); }

// =============== QUIZ LADDER ===============
const PRIZE=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,100000], SAFE=[3,7];
function startLadder(){ S={...S,screen:'ladder',next:rampQueue(S.subject,S.level),step:0,lives:3,wrong:[],score:0,fifty:true,swap:true,paused:true}; ldRound(); }
function ldRound(swapped){ clearTimers(); const q=S.cur=S.next(Math.floor(S.step/4)+ (S.level==='hard'&&S.step>=8?1:0)); S.answered=false; S.paused=false;
  const ms=30000;
  const lad=PRIZE.map((p,i)=>`<li class="${i===S.step?'now':''} ${i<S.step?'got':''} ${SAFE.includes(i)?'safe':''}"><span>${i+1}</span><b>${p.toLocaleString()}</b></li>`).reverse().join('');
  app.innerHTML=statusBar(`<span class="hearts">${heartStr(S.lives,3)}</span><span class="score">⭐ ${S.step?PRIZE[S.step-1].toLocaleString():0}</span>`)+`
    <div class="ladwrap"><ol class="ladder">${lad}</ol><div class="ladq">
      <div class="lifelines"><button class="btn" id="ll50" ${S.fifty?'':'disabled'}>✂️ 50:50</button><button class="btn" id="llsw" ${S.swap?'':'disabled'}>🔄 换一题</button></div>
      ${timerBar()}<p class="hint" style="margin:4px 0">第 ${S.step+1} 题 · 答对得 ${PRIZE[S.step].toLocaleString()} ⭐ ${lvTag(q)}</p>${mcqHTML(q)}</div></div>`;
  bindSpeak(q); app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ldAnswer(b));
  document.getElementById('ll50').onclick=()=>{ if(!S.fifty||S.answered) return; S.fifty=false; const wrong=shuffle([...app.querySelectorAll('.opt')].filter(b=>b.dataset.v!==q.answer)); wrong.slice(0,Math.max(0,wrong.length-1)).forEach(b=>{b.disabled=true;b.style.visibility='hidden';}); document.getElementById('ll50').disabled=true; tone(660,.1); };
  document.getElementById('llsw').onclick=()=>{ if(!S.swap||S.answered) return; S.swap=false; ldRound(true); };
  runTimer(ms,()=>ldFail(null)); }
function ldAnswer(b){ if(S.answered) return; S.answered=true; S.paused=true; const q=S.cur;
  if(mcqMark(q,b)){ S.score++; S.step++; sfx.good(); document.getElementById('fb').innerHTML=`<div class="fb ok"><h3>✓ 答对了！+${PRIZE[S.step-1].toLocaleString()} ⭐${SAFE.includes(S.step-1)?' · 🛡️ 到达安全关卡':''}</h3></div>`;
    later(()=> S.step>=PRIZE.length?endGame(true):ldRound(), 900); }
  else ldFail(b); }
function ldFail(b){ S.answered=true; S.paused=true; const q=S.cur; sfx.bad(); S.lives--; S.wrong.push({q,v:b?b.dataset.v:'（时间到）'});
  app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.v===q.answer) x.classList.add('right');});
  document.querySelector('.hearts').textContent=heartStr(S.lives,3);
  document.getElementById('fb').innerHTML=wrongBox(q,b?'✗ 答错了，扣一颗心':'⏰ 时间到，扣一颗心');
  contBtn(S.lives<=0?'看结果':'再挑战这一关 →',()=> S.lives<=0?endGame(false):ldRound()); }

// =============== END ===============
function endGame(win){
  clearTimers(); const sj=SUBJECTS[S.subject], g=S.game; let stars, title, line;
  if(g==='balloon'){ const max=S.total*10; stars=S.lives<=0?0:S.score>=max*.9?3:S.score>=max*.65?2:1;
    title=S.lives<=0?'气球都飞走了！':'完成了！'; line=`⭐ ${S.score} 分 · 答了 ${S.round} 题`; win=S.lives>0; }
  else if(g==='monster'){ stars=win?(S.lives===S.maxlives?3:S.lives>=S.maxlives/2?2:1):0;
    title=win?`你打败了${MON[S.level].name}！`:`${MON[S.level].name}赢了，再挑战一次！`; line=`答对 ${S.score} 题 · 剩下 ${S.lives} 颗心`; }
  else if(g==='race'){ const d=S.me-S.rival; stars=win?(d>=5?3:d>=3?2:1):0;
    title=win?'你赢了比赛！🏆':'电脑先到终点，再比一次！'; line=`你 ${S.me} 格 · 电脑 ${S.rival} 格 · 答错 ${S.wrong.length} 题`; }
  else if(g==='tf'){ const k={easy:1,medium:.85,hard:.7}[S.level]; stars=S.score>=15*k?3:S.score>=10*k?2:S.score>=5*k?1:0;
    title=`时间到！答对 ${S.score} 题`; line=`一共判断 ${S.total} 题 · 答错 ${S.wrong.length} 题`; win=stars>0; }
  else if(g==='castle'){ stars=win?S.hp:0; title=win?'城堡守住了！🏰':'城堡被攻破了，再守一次！'; line=`打倒 ${S.score} 只怪兽 · 到第 ${S.wave+1} 波 · 城墙剩 ${Math.max(0,S.hp)}`; }
  else if(g==='tower'){ stars=win?S.lives:0; title=win?'爬到塔顶了！🚩':`最高爬到第 ${S.best} 层`; line=`答对 ${S.score} 题 · 剩下 ${Math.max(0,S.lives)} 颗心`; }
  else if(g==='ladder'){ stars=win?S.lives:(S.step>=8?2:S.step>=4?1:0); const got=S.step?PRIZE[S.step-1]:0; title=win?'通关了！🏆 100,000 ⭐':`到达第 ${S.step} 关`; line=`拿到 ${got.toLocaleString()} ⭐ · 答对 ${S.score} 题`; win=win||S.step>=4; }
  else if(g==='frog'){ stars=win?S.lives:0; title=win?'青蛙安全过河了！🏝️':'青蛙掉进水里了，再试一次！'; line=`走了 ${S.row}/${S.rows} 步 · 剩下 ${S.lives} 颗心`; }
  else if(g==='mole'||g==='catch'){ const r=S.score/S.total; stars=S.lives<=0?0:r>=.9?3:r>=.65?2:1; win=S.lives>0;
    title=S.lives<=0?'心都用完了，再玩一次！':'完成了！'; line=`${g==='mole'?'打中':'接到'} ${S.score} 题 · 共 ${S.round} 题`; }
  else if(g==='board'){ const w=S.wrong.length; stars=w===0?3:w<=2?2:1; title='找到宝石了！💎'; line=`掷了 ${S.rolls} 次骰子 · 答对 ${S.score} 题 · 答错 ${w} 题`; }
  else if(g==='wheel'){ stars=S.points>=250?3:S.points>=150?2:S.points>=60?1:0; title=`一共 ${S.points} 分！`; line=`转了 ${WSPINS} 次 · 答对 ${S.score} 题`; win=stars>0; }
  else if(g==='bingo'){ const w=S.wrong.length; stars=w===0?3:w<=2?2:1; title=bgLines().length>=S.need?'BINGO！🎉':'全部格子完成！'; line=`答对 ${S.score} 题 · 答错 ${w} 次`; }
  else if(g==='order'){ stars=S.mist===0?3:S.mist<=3?2:1; title=`${ORD_N} 关全部完成！`; line=`一共点错 ${S.mist} 次`; }
  else { const n=S.pairs.length, secs=Math.round((Date.now()-S.t0)/1000); stars=S.moves<=n*1.5?3:S.moves<=n*2.2?2:1;
    title='全部配对成功！'; line=`翻牌 ${S.moves} 次 · 用了 ${Math.floor(secs/60)} 分 ${secs%60} 秒`; }
  (win?sfx.win:sfx.lose)();
  app.innerHTML=`<div class="result">
      <p class="label">${GAMES[g].icon} ${GAMES[g].name} · ${sj.name} · ${LV[S.level][0]}</p>
      <div class="stars" aria-label="${stars} stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <div class="big">${title}</div><p class="muted" style="margin:4px 0 0">${line}</p></div>
    ${g==='memory'?`<p class="label" style="margin-top:16px">这一局的配对</p><div class="review">${S.pairs.map(p=>`<div>${p[2]}</div>`).join('')}</div>`
      : S.wrong.length?`<p class="label" style="margin-top:16px">复习答错的题目</p><div class="review">${S.wrong.map(w=>`<div><div class="rq">${w.q.passage?'<span class="muted">（阅读）</span>':''}${w.q.prompt.replace(/<span class="blank">___<\/span>/g,'___')}</div><div>你的答案：<s>${esc(w.v)}</s> · 正确答案：<b>${esc(w.q.answer)}</b></div><div class="muted">${w.q.zh}</div></div>`).join('')}</div>`:''}
    <div class="row-end"><button class="btn" id="home">换游戏 / 科目</button><button class="btn primary" id="again">再玩一次 ↻</button></div>`;
  document.getElementById('home').onclick=home;
  document.getElementById('again').onclick=()=>START()[g]();
}

document.addEventListener('keydown',e=>{
  if(['monster','race','board','wheel','castle','tower','ladder'].includes(S.screen)&&!S.answered&&/^[1-4]$/.test(e.key)){ const b=document.getElementById('opt-'+(+e.key-1)); if(b) b.click(); }
});
home();
</script>
